<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 https:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'">
  <title>Cổng học viên | Văn Song</title>
  <link rel="icon" type="image/png" href="./a.png">
  <link rel="stylesheet" href="./assets/site.css?v=23">
</head>
<body>
  <main class="login-page">
    <div class="login-shell">
      <header class="login-brand">
        <img class="login-logo" src="./a.png" alt="Văn Song">
        <div class="login-slogan">Học Văn để hiểu mình, hiểu người và hiểu cuộc sống.</div>
        <div class="login-divider"></div>
      </header>
      <section class="card login-card">
        <h2>Đăng nhập</h2>
        <p class="muted">Nhập tài khoản học viên đã được cấp.</p>
        <form id="loginForm" novalidate>
          <label for="username">Tên đăng nhập</label>
          <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
          <label for="password">Mật khẩu</label>
          <input id="password" type="password" autocomplete="current-password" required>
          <p id="loginError" class="form-error" hidden></p>
          <button id="loginButton" class="btn primary full login-submit" type="submit">Đăng nhập</button>
        </form>
      </section>
      <p class="login-foot">Thông tin tài khoản được bảo vệ và không hiển thị công khai.</p>
    </div>
  </main>
  <script src="./config.js?v=22"></script>
  <script src="./assets/common.js?v=22"></script>
  <script src="./assets/login.js?v=22"></script>
</body>
</html>
